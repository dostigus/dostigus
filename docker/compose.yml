# Self-host Cluster (ADR 0005).
# From the repo root:
#   docker compose -f docker/compose.yml up --build
# Host: http://localhost:3000/
# Store: named volume cluster-data → /var/lib/dostigus

name: dostigus

services:
  host:
    image: ghcr.io/dostigus/dostigus:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/var/lib/dostigus/cluster.sqlite
      # Optional LLM gateway — leave unset for stub Chat replies (see docs/deploy.md).
      # Env overrides Host Settings. The Owner can also paste a key in Settings.
      # OPENAI_COMPATIBLE_BASE_URL: https://openrouter.ai/api/v1
      # LLM_API_KEY:
      # OPENROUTER_API_KEY:
      # LLM_MODEL:
      # LLM_MODEL_CHEAP:
      # LLM_MODEL_STRONG:
      # LLM_MODEL_CODE:
      # LLM_MODEL_TOY:
      # LLM_DEFAULT_TIER:
      # MCP surface — empty → tools stay disabled (see docs/deploy.md).
      # NUXT_AGENT_TOKEN:
      # DOSTIGUS_MCP_TOKEN:
    volumes:
      - cluster-data:/var/lib/dostigus
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  cluster-data:
