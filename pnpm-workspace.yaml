shamefullyHoist: true
shellEmulator: true

trustPolicy: no-downgrade
# semver@6.3.1 (published 2023-07-10) is a 6.x release that landed after
# semver@7.5.x versions with provenance. pnpm compares trust by publish
# date, so every non-frozen resolve reports ERR_PNPM_TRUST_DOWNGRADE for
# this pin (Nuxt → @babel/core) even though pnpm-lock.yaml already has it.
# Exact version only: newer semver releases stay under no-downgrade.
trustPolicyExclude:
  - semver@6.3.1

packages:
  - apps/*
  - packages/*

autoInstallPeers: true

allowBuilds:
  esbuild: true
  sharp: true

catalog:
  '@antfu/eslint-config': ^6.3.0
  '@nuxt/fonts': ^0.14.0
  '@nuxtjs/i18n': ^10.6.0
  '@nuxtjs/mcp-toolkit': ^0.18.0
  '@types/node': ^24.3.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  eslint: ^9.36.0
  markdown-it: ^15.0.2
  nuxt: ^4.1.2
  nuxt-auth-utils: ^0.5.30
  reka-ui: ^2.10.3
  sharp: ^0.35.4
  typescript: ^5.9.2
  undici: ^8.10.2
  # @nuxt/vite-builder depends on vite ^8.2.0. A 7.x catalog range makes
  # a non-frozen pnpm add retarget those peers to vite@7.3.6.
  vite: ^8.2.0
  vitest: ^3.2.4
  vue: 3.5.43
  vue-tsc: ^3.0.6
  zod: ^4.4.3
